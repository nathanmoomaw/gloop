name: Deploy to S3

on:
  push:
    branches: [main, 'dev/**']

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify AWS secrets present
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::AWS secrets missing. Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in repo Settings → Secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Build failed — dist/index.html missing."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://gloop.obfusco.us/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E1OR0VU2T3D7I5 --paths "/*"

      - name: Smoke test prod
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gloop.obfusco.us/)
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Prod smoke test returned HTTP $STATUS — verify site manually."
          else
            echo "Prod site OK (HTTP $STATUS)"
          fi

  deploy-dev:
    if: startsWith(github.ref, 'refs/heads/dev/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify AWS secrets present
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::AWS secrets missing. Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in repo Settings → Secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Build failed — dist/index.html missing."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to dev S3
        run: aws s3 sync dist/ s3://gloop-dev.obfusco.us/ --delete

      - name: Invalidate dev CloudFront
        run: aws cloudfront create-invalidation --distribution-id E1EW5T5VWLL28W --paths "/*"

      - name: Smoke test dev
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gloop-dev.obfusco.us/)
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Dev smoke test returned HTTP $STATUS — verify site manually."
          else
            echo "Dev site OK (HTTP $STATUS)"
          fi
